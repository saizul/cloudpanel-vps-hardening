name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: for f in *.sh lib/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -x *.sh lib/*.sh tests/*.bash tests/*.bats
      - name: Dry-run smoke test
        run: |
          cp config.env.example config.env
          ./harden.sh --check-config
          ./backup.sh --check-config
          ./redis-setup.sh --check-config
          sudo ./php-update-check.sh --dry-run || true
          ./ssl-expiry-check.sh --dry-run example.com:443
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats
      - name: Bats test suite
        run: bats tests
